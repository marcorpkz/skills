[github_app]
pr_commands = [
    "/agentic_review",
]

[review_agent]
comments_location_policy = "both"
inline_comments_severity_threshold = 3
issues_user_guidelines = "Focus on correctness, security, data loss, Roblox Studio safety boundaries, and protocol compatibility. Avoid style-only feedback."
compliance_user_guidelines = "Do not weaken loopback-only transport, token authentication, managed build roots, Undo recording, redaction, or external asset allowlists."
